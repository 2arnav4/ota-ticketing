# Local + test MySQL only. Credentials here are throwaway local values, never used in prod.
services:
  mysql:
    image: mysql:8.4
    container_name: ota-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ota_root_local
      MYSQL_DATABASE: ota
      MYSQL_USER: ota
      MYSQL_PASSWORD: ota_local
    volumes:
      - ota-mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pota_root_local"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ota-mysql-data:
